<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>角色造型参考库 · 细节卡</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">角色造型<span>参考库</span></div>
  <nav>
    <a href="index.html">素材墙</a>
    <a href="cards.html" class="on">细节卡</a>
  </nav>
  <button class="themebtn" id="themeBtn" title="切换白天/夜晚模式">☾</button>
  <div class="search"><input id="q" placeholder="搜细节名称或提示词，如：腰封、珠花、交领"></div>
</header>

<div class="wrap">
  <aside>
    <div class="hd" id="cnt">细节卡</div>
    <a href="#" data-g="" id="allLink" class="g1 on">全部</a>
    <div id="toc"></div>
  </aside>
  <main>
    <h1 id="title">全部细节卡</h1>
    <div id="sub" style="color:#8b8f98;font-size:13px;margin:-6px 0 14px"></div>
    <div class="cards" id="list"></div>
    <div class="empty" id="empty" style="display:none">没有匹配的细节卡</div>
  </main>
</div>

<script>
const $ = s => document.querySelector(s);
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
let ALL = [], FILTER = "";

function cat(id){                       // 面部-女-001 → 面部
  const p = id.split("-");
  return p[0] + (p[1]==="女"||p[1]==="男" ? "" : "");
}
function gender(id){
  const p = id.split("-");
  return (p[1]==="女"||p[1]==="男") ? p[1] : "";
}
function group(c){
  const g = gender(c.id);
  return (g ? g + " / " : "") + cat(c.id);
}

function toc(){
  const g = {};
  ALL.forEach(c => { const k = group(c); g[k] = (g[k]||0)+1; });
  const box = $("#toc"); box.innerHTML = "";
  Object.keys(g).sort((a,b)=>{
    const o = x => x.startsWith("女") ? 0 : x.startsWith("男") ? 1 : 2;
    return o(a)-o(b) || a.localeCompare(b,"zh");
  }).forEach(k=>{
    const a = document.createElement("a");
    a.href="#"; a.dataset.g=k;
    a.innerHTML = "<span>"+esc(k)+"</span><span>"+g[k]+"</span>";
    a.onclick = e=>{ e.preventDefault(); FILTER=k; document.querySelectorAll("aside a").forEach(x=>x.classList.toggle("on",(x.dataset.g||"")===k)); render(); };
    box.appendChild(a);
  });
}

function render(){
  const q = $("#q").value.trim().toLowerCase();
  const list = ALL.filter(c => {
    if (FILTER && group(c) !== FILTER) return false;
    if (!q) return true;
    return (c.id+c.title+c.points.map(p=>p.name+p.prompt+p.pit).join(" ")).toLowerCase().includes(q);
  });
  $("#title").textContent = FILTER || "全部细节卡";
  $("#sub").textContent = `${list.length} / ${ALL.length} 张`;
  $("#empty").style.display = list.length ? "none":"block";
  const box = $("#list"); box.innerHTML = "";
  list.forEach(c=>{
    const d = document.createElement("div"); d.className="dcard";
    const pts = c.points.map((p,i)=>`
      <div class="pt">
        ${p.crop?`<img loading="lazy" src="${esc(p.crop)}" alt="">`:""}
        <div>
          <div class="nm"><i>${i+1}</i>${esc(p.name)}</div>
          <div class="pr">${esc(p.prompt)}</div>
          <div class="pit">⚠ ${esc(p.pit)}</div>
        </div>
      </div>`).join("");
    d.innerHTML = `<div class="top"><span class="id">${esc(c.id)}</span><span class="ti">${esc(c.title)}</span></div>
      <div class="body"><div><img class="hero" loading="lazy" src="${esc(c.img)}" alt=""></div>
      <div class="pts">${pts}</div></div>`;
    box.appendChild(d);
  });
  $("#cnt").textContent = "共 " + ALL.length + " 张";
}
$("#q").addEventListener("input", render);
$("#allLink").onclick = e => { e.preventDefault(); FILTER=""; document.querySelectorAll("aside a").forEach(x=>x.classList.toggle("on", (x.dataset.g||"")==="")); render(); };
fetch("data/cards.json?v=1793595513").then(r=>r.json()).then(d=>{ ALL=d; toc(); render(); });
</script>



<script>
(function(){
  var KEY='rr_theme';
  function apply(t){document.documentElement.setAttribute('data-theme',t);
    var b=document.getElementById('themeBtn'); if(b) b.textContent = t==='light'?'☀':'☾';}
  var t='dark';
  try{ t = localStorage.getItem(KEY) || 'dark'; }catch(e){}
  apply(t);
  document.addEventListener('click', function(e){
    if(e.target && e.target.id==='themeBtn'){
      var cur = document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';
      try{ localStorage.setItem(KEY, cur); }catch(e){}
      apply(cur);
    }
  });
})();
</script>


<div id="gate" style="position:fixed;inset:0;z-index:9999;background:#0d0e11;display:flex;align-items:center;justify-content:center;font-family:system-ui,'Microsoft YaHei',sans-serif">
  <div style="width:320px;text-align:center">
    <div style="color:#c9a227;font-size:20px;letter-spacing:.08em;margin-bottom:6px">角色造型参考库</div>
    <div style="color:#8b8f98;font-size:12px;margin-bottom:22px">内部资料 · 请输入访问密码</div>
    <input id="gateInput" type="password" placeholder="访问密码" style="width:100%;padding:11px 12px;border-radius:8px;border:1px solid #2a2c31;background:#15171b;color:#e6e6e6;outline:none" />
    <div id="gateMsg" style="color:#e06c5a;font-size:12px;height:18px;margin-top:8px"></div>
    <button id="gateBtn" style="width:100%;margin-top:6px;padding:11px;border-radius:8px;border:0;background:#c9a227;color:#1a1a1a;font-weight:600;cursor:pointer">进入</button>
  </div>
</div>
<script>
(function(){
  var PASS = "hanfu2026";
  if (location.hostname === "127.0.0.1" || location.hostname === "localhost") {
    var g0 = document.getElementById("gate"); if (g0) g0.remove(); return;
  }
  try { if (localStorage.getItem("rr_ok") === PASS) { document.getElementById("gate").remove(); return; } } catch(e) {}
  var inp = document.getElementById("gateInput"), msg = document.getElementById("gateMsg");
  function go(){
    if (inp.value === PASS) {
      try { localStorage.setItem("rr_ok", PASS); } catch(e) {}
      document.getElementById("gate").remove();
    } else { msg.textContent = "密码不对"; }
  }
  document.getElementById("gateBtn").addEventListener("click", go);
  inp.addEventListener("keydown", function(e){ if (e.key === "Enter") go(); });
  inp.focus();
})();
</script>

</body>
</html>
