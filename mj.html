<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>角色造型参考库 · MJ 图库</title>
<link rel="stylesheet" href="style.css">
<style>
.mjgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.mjcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,border-color .15s}
.mjcard:hover{transform:translateY(-3px);border-color:var(--accent)}
.mjcard .thumb{position:relative;aspect-ratio:4/3;background:var(--bg2);overflow:hidden;cursor:zoom-in}
.mjcard .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.mjcard .no{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.6);color:#e8dcc0;font-size:11px;padding:2px 7px;border-radius:6px}
.mjcard .bd{padding:9px 10px 11px;display:flex;flex-direction:column;gap:6px}
.mjcard .st{font-size:13px;color:var(--tx);font-weight:600;line-height:1.35}
.mjcard .cd{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--accent2);background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:4px 6px;word-break:break-all}
.mjcard .tn{font-size:11px;color:var(--tx2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mjcard .pm{font-size:10.5px;color:var(--tx3);font-family:ui-monospace,Consolas,monospace;word-break:break-all}
.mjcard .btns{display:flex;gap:6px;margin-top:2px}
.mjcard .btns button{flex:1;background:var(--bg2);color:var(--tx);border:1px solid var(--line);border-radius:6px;font-size:11px;padding:4px 0;cursor:pointer}
.mjcard .btns button:hover{border-color:var(--accent);color:var(--accent)}
#mjmodal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:200;padding:24px}
#mjmodal.on{display:flex}
#mjmodal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:1100px;width:100%;max-height:88vh;overflow:auto;padding:16px;display:grid;grid-template-columns:minmax(260px,1fr) minmax(320px,1.1fr);gap:16px}
#mjmodal img{width:100%;border-radius:10px;display:block}
#mjmodal textarea{width:100%;height:300px;background:var(--bg2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;line-height:1.6;font-family:ui-monospace,Consolas,monospace}
#mjmodal .mbtns{display:flex;gap:8px;margin-top:8px}
#mjmodal .mbtns button{background:var(--accent);color:#1a1a1a;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:12px}
#mjmodal .mbtns button.sec{background:var(--bg2);color:var(--tx);border:1px solid var(--line)}
aside .grp{color:var(--tx3);font-size:11px;margin:10px 0 4px;padding-left:2px}
</style>
</head>
<body>
<header>
  <div class="brand">角色造型<span>参考库</span></div>
  <nav>
    <a href="index.html">素材墙</a>
    <a href="cards.html">细节卡</a>
    <a href="videos.html">视频库</a>
    <a href="mj.html" class="on">MJ 图库</a>
  </nav>
  <button class="themebtn" id="themeBtn" title="切换白天/夜晚模式">☾</button>
  <div class="search"><input id="q" placeholder="搜风格 / 色调 / 提示词 / 码"></div>
</header>

<div class="wrap">
  <aside><div class="hd">MJ 图库 · 493</div><div id="navwrap"></div></aside>
  <main>
    <h1 id="title">全部</h1>
    <div id="sub" style="color:#8b8f98;font-size:13px;margin:-6px 0 14px"></div>
    <div class="mjgrid" id="list"></div>
  </main>
</div>

<div id="mjmodal"><div class="box">
  <div><img id="mimg" alt=""><div class="mbtns"><button onclick="cpModal()">复制完整提示词</button><button class="sec" onclick="cpModalPv()">复制 + --preview</button></div></div>
  <div><div id="mtitle" style="font-weight:600;margin-bottom:8px"></div><textarea id="mtext" readonly></textarea><div class="mbtns"><button class="sec" onclick="closeM()">关闭</button></div></div>
</div></div>

<script>
const SEC = {char:'角色 · 人像', scene:'场景 · 环境', juwu:'巨物 · 怪兽'};
let DATA = null, cur = 'all', q = '';
const list = document.getElementById('list'), sub = document.getElementById('sub'), title = document.getElementById('title');

async function boot(){
  const r = await fetch('data/mj-5359137c.json'); DATA = await r.json();
  buildNav(); render();
}
function buildNav(){
  const w = document.getElementById('navwrap');
  const counts = {all: DATA.cards.length};
  let html = '<a href="#" data-k="all" class="g1 on">全部</a>';
  for(const sec of ['char','scene','juwu']){
    const subs = Object.entries(DATA.subcats).filter(([k,v]) => v.section === sec);
    if(!subs.length) continue;
    html += `<div class="grp">${SEC[sec]}</div>`;
    for(const [k,v] of subs){
      const n = DATA.cards.filter(c => c.sub === k).length;
      html += `<a href="#" data-k="${k}" class="g1">${v.name} <span style="color:var(--tx3)">${n}</span></a>`;
    }
  }
  w.innerHTML = html;
  w.querySelectorAll('a').forEach(a => a.onclick = ev => {
    ev.preventDefault(); cur = a.dataset.k;
    w.querySelectorAll('a').forEach(x => x.classList.toggle('on', x === a));
    title.textContent = cur === 'all' ? '全部' : (DATA.subcats[cur] ? DATA.subcats[cur].name : '');
    render();
  });
}
function render(){
  const arr = DATA.cards.filter(c => (cur === 'all' || c.sub === cur) &&
    (!q || (c.style+' '+c.tone+' '+c.medium+' '+c.prompt+' '+c.code).toLowerCase().includes(q)));
  sub.textContent = arr.length + ' / ' + DATA.cards.length + ' 张';
  list.innerHTML = arr.map(c => `
    <div class="mjcard">
      <div class="thumb" onclick="openM('${c.key}')"><img loading="lazy" src="${c.img}" alt="">
        <div class="no">#${c.num} ${c.badge==='multi'?'· 混码':''}</div></div>
      <div class="bd">
        <div class="st">${c.style || '（无风格标签）'}</div>
        <div class="cd">${c.code || ''}</div>
        <div class="tn">${c.tone || ''}${c.medium ? '｜' + c.medium : ''}</div>
        <div class="pm">${c.params || ''}</div>
        <div class="btns"><button onclick="cpCode('${c.key}')">复制码</button><button onclick="openM('${c.key}')">完整提示词</button></div>
      </div>
    </div>`).join('');
}
function find(k){ return DATA.cards.find(c => c.key === k); }
function cp(t){ navigator.clipboard.writeText(t).then(()=>toast('已复制')).catch(()=>toast('复制失败')); }
function cpCode(k){ const c = find(k); cp(c.code); }
function openM(k){ const c = find(k);
  document.getElementById('mimg').src = c.img;
  document.getElementById('mtitle').textContent = '#' + c.num + ' ' + c.style;
  document.getElementById('mtext').value = c.prompt;
  document.getElementById('mjmodal').classList.add('on');
  window.__cur = c;
}
function closeM(){ document.getElementById('mjmodal').classList.remove('on'); }
function cpModal(){ cp(document.getElementById('mtext').value); }
function cpModalPv(){ cp(document.getElementById('mtext').value + ' --preview'); }
document.getElementById('mjmodal').addEventListener('click', e => { if(e.target.id === 'mjmodal') closeM(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeM(); });
function toast(m){ let t=document.getElementById('toast'); if(!t){t=document.createElement('div');t.id='toast';
  t.style.cssText='position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--accent);color:#1a1a1a;padding:8px 16px;border-radius:20px;font-size:13px;z-index:300';
  document.body.appendChild(t);} t.textContent=m; t.style.opacity=1; clearTimeout(window.__tt); window.__tt=setTimeout(()=>t.style.opacity=0,1800); }
document.getElementById('q').addEventListener('input', e => { q = e.target.value.trim().toLowerCase(); render(); });
boot();
</script>

<script>
(function(){
  var KEY='rr_theme';
  function apply(t){document.documentElement.setAttribute('data-theme',t);
    var b=document.getElementById('themeBtn'); if(b) b.textContent = t==='light'?'☀':'☾';}
  var t='dark';
  try{ t = localStorage.getItem(KEY) || 'dark'; }catch(e){}
  apply(t);
  document.addEventListener('click', function(e){
    if(e.target && e.target.id==='themeBtn'){
      var cur = document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';
      try{ localStorage.setItem(KEY, cur); }catch(e){}
      apply(cur);
    }
  });
})();
</script>


<div id="gate" style="position:fixed;inset:0;z-index:9999;background:#0d0e11;display:flex;align-items:center;justify-content:center;font-family:system-ui,'Microsoft YaHei',sans-serif">
  <div style="width:320px;text-align:center">
    <div style="color:#c9a227;font-size:20px;letter-spacing:.08em;margin-bottom:6px">角色造型参考库</div>
    <div style="color:#8b8f98;font-size:12px;margin-bottom:22px">内部资料 · 请输入访问密码</div>
    <input id="gateInput" type="password" placeholder="访问密码" style="width:100%;padding:11px 12px;border-radius:8px;border:1px solid #2a2c31;background:#15171b;color:#e6e6e6;outline:none" />
    <div id="gateMsg" style="color:#e06c5a;font-size:12px;height:18px;margin-top:8px"></div>
    <button id="gateBtn" style="width:100%;margin-top:6px;padding:11px;border-radius:8px;border:0;background:#c9a227;color:#1a1a1a;font-weight:600;cursor:pointer">进入</button>
  </div>
</div>
<script>
(function(){
  var PASS = "hanfu2026";
  if (location.hostname === "127.0.0.1" || location.hostname === "localhost") {
    var g0 = document.getElementById("gate"); if (g0) g0.remove(); return;
  }
  try { if (localStorage.getItem("rr_ok") === PASS) { document.getElementById("gate").remove(); return; } } catch(e) {}
  var inp = document.getElementById("gateInput"), msg = document.getElementById("gateMsg");
  function go(){
    if (inp.value === PASS) {
      try { localStorage.setItem("rr_ok", PASS); } catch(e) {}
      document.getElementById("gate").remove();
    } else { msg.textContent = "密码不对"; }
  }
  document.getElementById("gateBtn").addEventListener("click", go);
  inp.addEventListener("keydown", function(e){ if (e.key === "Enter") go(); });
  inp.focus();
})();
</script>

</body>
</html>
