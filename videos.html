消失，最后眼眶湿润。先确定情绪从哪里开始、在哪个动作上转折、最终停在哪里，再补充每个阶段的细节。 第二，把情绪词转成面部动作。“眼神悲伤”比较抽象，可以具体写成“视线从远处慢慢落下，焦点短暂失去”；“忍住眼泪”可以写成“轻轻抿唇，呼吸停顿一下，缓慢眨眼，眼眶逐渐泛起泪光”。提示词尽量描述能被画面呈现的变化，而不是只给情绪下定义。 第三，动作要有先后和节奏。眼神先变化，嘴角随后放松，呼吸再出现轻微停顿，这些细节可以按顺序安排。适当使用“逐渐”“短暂停留”“缓慢消退”等词，帮助情绪自然过渡。不要要求眼睛、眉毛、嘴角同时大幅变化，也避免每一秒都增加新动作。 第四，控制表演幅度。**面部特写里，细小变化已经足够清楚。提示词可以强调嘴角轻微扬起后自然松开、眼睑略微收紧、眼角逐渐湿润。动作幅度太大，容易让微表情变成夸张表演；同时写太多肌肉细节，也可能让画面重点分散。 第五，让结尾有铺垫。**如果结尾要加入流泪，不要直接写“开始哭泣”。可以按“情绪压住—眼眶湿润—泪水积聚—一滴眼泪滑落—表情恢复平静”逐步安排。镜头可以在情绪变化后缓慢推进，并在泪水落下后短暂停留，让表演有完整收束。 写完后检查三点：情绪线是否明确，表情动作是否具体，前后变化是否连贯。提示词把这三件事交代清楚，人物微表情就更容易形成自然、完整的表演过程。","author":"航仔AI日记","like":"4859","tags":["ai演技","ai创作者浪潮计划","ai帮我恢复生产力"],"cat":"teach","href":"https://www.douyin.com/video/7694958465999031594","cover":"img/dy/7694958465999031594.jpg"},{"id":"7681896931370927845","title":"AI运镜/镜头练习 。这短短的几秒，提示词都快成论文了","author":"无敌的小Ye","like":"2.1万","tags":["抖音ai创作大赛","ai创作热潮计划","未来导演扶持计划"],"cat":"teach","href":"https://www.douyin.com/video/7681896931370927845","cover":"img/dy/7681896931370927845.jpg"},{"id":"7701686626887545849","title":"我不装了","author":"fufu","like":"5697","tags":["电竞女选手","chovy"],"cat":"visual","href":"https://www.douyin.com/video/7701686626887545849","cover":"img/dy/7701686626887545849.jpg"},{"id":"7694537739684941107","title":"《创作万岁》01｜天赋，是杀不死的 改过无数版， 还是会为一个好想法兴奋。 被否定过很多次， 下一次，还是想做点不一样的。 TapNow 周年庆，《创作万岁》第一篇。 献给始终期待下一次创作的你。","author":"TapNow","like":"5.1万","tags":["tapnow","TapTV","创作万岁"],"cat":"visual","href":"https://www.douyin.com/video/7694537739684941107","cover":"img/dy/7694537739684941107.jpg"},{"id":"7685662489501068465","title":"朋友，你不许再爱了！ 《阿丘的花语》开始连载啦！全屏观看效果更佳～ 全片使用小云雀AI制作","author":"阿丘的花语","like":"23.3万","tags":["小云雀创作者计划","AI创作浪潮计划","未来导演扶持计划"],"cat":"story","href":"https://www.douyin.com/video/7685662489501068465","cover":"img/dy/7685662489501068465.jpg"},{"id":"7700221506588273866","title":"放心说…老子不动手…《偷》 妖主失其钵钵鸡，以测谎铃诘鱼、蟆二精。自言不怒，铃遽鸣；二精皆言未食，铃竟无声。鱼忽忘所来，妖主疑之，赐以猪儿粑。食罢七秒，复问，鱼茫然不忆，铃亦不鸣。妖主讥曰：“汝真奇才！”鱼欣然称谢，妖主惟报以白眼。","author":"脑洞视界","like":"7.3万","tags":["美 "id":"7684223214016896613","title":"最全最细AI视频白模教程！ GPT-6 Astra调用Blender建白模，结合Seedance2.5精准控制复杂运镜和动作，避免反复抽卡！","author":"foyege","like":"1.8万","tags":["ai教程","blender","gpt6"],"cat":"teach","href":"https://www.douyin.com/video/7684223214016896613","cover":"img/dy/7684223214016896613.jpg"},{"id":"7689754085104373001","title":"什么是缘分...","author":"赵星星的AI小剧场","like":"6544","tags":["AI搞笑视频","喵星人","搞笑"],"cat":"visual","href":"https://www.douyin.com/video/7689754085104373001","cover":"img/dy/7689754085104373001.jpg"},{"id":"7700111336755203378","title":"15秒一镜到底，街头电影感是怎么做出来的？ 做 AI 一镜到底，提示词里只写“镜头跟随人物”还不够。镜头从哪里开始、怎么绕、人物在什么时候转头，背景如何跟着变化，都要提前安排好。以这段法国街头为例，重点写清楚这几件事： 1. 先设计人物的行走路线，再设计镜头路线 女生从花店旁经过，沿着街道走进广场。开场让镜头在她的侧前方平行跟拍，带到橱窗和花束；走出街边后，镜头再平稳地绕到她身后，转成背后跟拍。人物路线和镜头路线分开写清楚，画面才不会变成镜头绕来绕去、人物却不知道往哪走。 2. 镜头移动要匀速，人物位置尽量稳定 这段画面的重点不是高速运镜，而是镜头随着女生步伐缓慢移动，保持差不多的拍摄距离和人物大小。镜头由侧面转到背后时，背景建筑、花店和广场座椅自然产生前后层次变化。提示词可以写“稳定器跟拍、平滑环绕、保持人物在画面中部”，同时避免突然推近、急转或忽快忽慢。 3. 人物动作设计要少而明确 女生自然行走，经过花店时不必刻意停下来；进入广场后，她注意到前方玩耍的孩子，轻轻转头，露出短暂笑意，然后转回身继续往前。一个清楚的动作顺序，比同时安排回头、挥手、停步和大幅转身更容易保持连贯。表情也不用太夸张，轻微的好奇和微笑就能融入这段日常感。 4. 背景人物和物体要分层安排 前景用花店和花束带出街道生活感，中景留给女生行走，远景安排广场、咖啡桌、零散行人和孩子。鸽子可以在地面觅食，孩子跑过时再轻轻飞起；背景行人保持自然活动，不要所有人都同时向镜头看。这样既有生活细节，也不会抢走主体。 5. 阳光写方向，也要写作用 画面是温暖的午后阳光，可以设定为从人物侧后方照来，让发丝边缘有柔和轮廓光，地面留下自然的长影，镜头偶尔出现轻微光斑。要补充“光线方向和强度保持稳定”，避免镜头转向后阳光忽明忽暗、人物脸部过曝，或者光斑频繁闪烁。 最后检查一镜到底的连续性：女生走路时脚步是否自然，转头后镜头是否继续跟上，孩子和鸽子有没有突然出现或位置跳变。","author":"航仔AI日记","like":"3.2万","tags":["ai一镜到底","ai电影感","抖音精选app征稿中"],"cat":"teach","href":"https://www.douyin.com/video/7700111336755203378","cover":"img/dy/7700111336755203378.jpg"},{"id":"7697119502433111331","title":"【猫师傅小妙招】——小银绡才不是宠物呢... 局部修改和画质优化，银绡学做漫剧篇","author":"修仙烦死了","like":"6283","tags":["AI漫剧一站式创作","AI大神做漫剧真有一套","AI生成后编辑"],"cat":"story","href":"https://www.douyin.com/video/7697119502433111331","cover":"img/dy/7697119502433111331.jpg"},{"id":"7698977781489486566","title":"爽看《美妖姐姐麾下全是呆瓜》超长精选合集 建议收藏下来慢慢看，高清4K爆笑来袭~","author":"脑洞视界","like":"385.5万","tags":["美妖姐姐麾下全是呆瓜","即梦AI创作者成长计划","AIGC"],"cat":"story","hr
