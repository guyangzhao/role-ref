<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>角色造型参考库 · 视频库</title>
<link rel="stylesheet" href="style.css">
<style>
.vygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:16px}
.vcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s;display:flex;flex-direction:column}
.vcard:hover{transform:translateY(-3px);border-color:var(--accent)}
.vcard .thumb{position:relative;aspect-ratio:3/4;background:var(--bg2);overflow:hidden}
.vcard .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.vcard .thumb .ph{display:flex;align-items:center;justify-content:center;height:100%;color:var(--tx3);font-size:12px}
.vcard .like{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.62);color:#fff;font-size:11px;padding:2px 6px;border-radius:6px}
.vcard .src{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.55);color:#e8dcc0;font-size:10px;padding:2px 6px;border-radius:6px}
.vcard .body{padding:9px 10px 11px;display:flex;flex-direction:column;gap:6px}
.vcard .t{font-size:13px;line-height:1.45;color:var(--tx);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vcard .meta{font-size:11px;color:var(--tx2)}
.vcard .tags{display:flex;gap:5px;flex-wrap:wrap}
.vcard .catsel{margin-top:2px;width:100%;background:var(--bg2);color:var(--tx);border:1px solid var(--line);border-radius:6px;font-size:11px;padding:3px}
.vcard .tag{font-size:10px;color:var(--accent);border:1px solid var(--line);background:var(--bg2);border-radius:999px;padding:1px 7px}
#editbar{position:fixed;right:18px;bottom:18px;background:var(--panel);color:var(--accent);border:1px solid var(--line);padding:8px 12px;border-radius:10px;font-size:12px;z-index:98;display:flex;gap:8px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#editbar button{background:var(--accent);color:#1a1a1a;border:0;border-radius:6px;padding:5px 10px;cursor:pointer;font-size:12px}
#editbar .pend{color:var(--tx2)}
</style>
</head>
<body>
<header>
  <div class="brand">角色造型<span>参考库</span></div>
  <nav>
    <a href="index.html">素材墙</a>
    <a href="cards.html">细节卡</a>
    <a href="videos.html" class="on">视频库</a>
    <a href="mj.html">MJ 图库</a>
  </nav>
  <button class="themebtn" id="themeBtn" title="切换白天/夜晚模式">☾</button>
  <div class="search"><input id="q" placeholder="搜标题 / 作者 / 话题"></div>
</header>

<div class="wrap">
  <aside>
    <div class="hd">视频库 · 234</div>
    <a href="#" data-cat="all" class="g1 on">全部</a>
    <a href="#" data-cat="teach" class="g1">教学视频</a>
    <a href="#" data-cat="visual" class="g1">优质参考 · 画面</a>
    <a href="#" data-cat="story" class="g1">优质参考 · 内容</a>
    <a href="#" data-cat="mat" class="g1">素材</a>
  </aside>
  <main>
    <h1 id="title">全部视频</h1>
    <div id="sub" style="color:#8b8f98;font-size:13px;margin:-6px 0 14px"></div>
    <div class="vygrid" id="list"></div>
  </main>
</div>

<script>
const CAT = {all:'全部视频', teach:'教学视频', visual:'优质参考 · 画面', story:'优质参考 · 内容', mat:'素材'};
const ORDER = ['teach','visual','story','mat'];
let DATA = [], cat = 'all', q = '', EDIT = false, pending = 0;
const list = document.getElementById('list'), sub = document.getElementById('sub'), title = document.getElementById('title');

async function loadData(){
  const r = await fetch('data/videos-96b57908.json');
  DATA = await r.json();
  document.querySelector('aside .hd').textContent = '视频库 · ' + DATA.length;
  render();
}

function render(){
  const arr = DATA.filter(d => (cat==='all'||d.cat===cat) &&
    (!q || (d.title+' '+d.author+' '+d.tags.join(' ')).toLowerCase().includes(q)));
  title.textContent = CAT[cat];
  sub.textContent = arr.length + ' / ' + DATA.length + ' 条';
  list.innerHTML = arr.map(d => `
    <div class="vcard" data-href="${d.href}">
      <div class="thumb">${d.cover ? `<img loading="lazy" src="${d.cover}" alt="">` : '<div class="ph">封面抓取失败</div>'}
        ${d.like ? `<div class="like">♥ ${d.like}</div>` : ''}
        ${d.src === 'sucai' ? '<div class="src">素材夹</div>' : ''}</div>
      <div class="body">
        <div class="t">${d.title || '（无标题）'}</div>
        <div class="meta">${d.author || ''}</div>
        <div class="tags">${d.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
        ${EDIT ? `<select class="catsel" data-id="${d.id}" data-cur="${d.cat}">
          <option value="teach">教学视频</option>
          <option value="visual">优质参考 · 画面</option>
          <option value="story">优质参考 · 内容</option>
          <option value="mat">素材</option>
        </select>` : ''}
      </div>
    </div>`).join('');
  if(EDIT) bindSelects();
}

function bindSelects(){
  document.querySelectorAll('.catsel').forEach(s => {
    s.value = s.dataset.cur;
    s.onclick = e => e.stopPropagation();
    s.onchange = async e => {
      e.stopPropagation();
      const id = s.dataset.id, val = s.value;
      const it = DATA.find(x=>x.id===id);
      if(it) it.cat = val;
      pending++;
      updateBar();
      try{
        const r = await fetch('/api/cat', {method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({id, cat: val})});
        if(!r.ok) throw new Error('bad');
        toast('已移到「' + CAT[val] + '」');
        render();
      }catch(err){ toast('保存失败'); }
    };
  });
}

list.addEventListener('click', e => {
  if(e.target.closest('select')) return;
  const c = e.target.closest('.vcard'); if(c) window.open(c.dataset.href, '_blank');
});
document.querySelectorAll('aside [data-cat]').forEach(el => el.addEventListener('click', ev => {
  ev.preventDefault();
  cat = el.dataset.cat;
  document.querySelectorAll('aside [data-cat]').forEach(x => x.classList.toggle('on', x === el));
  render();
}));
document.getElementById('q').addEventListener('input', e => { q = e.target.value.trim().toLowerCase(); render(); });

function toast(msg){
  let t = document.getElementById('toast');
  if(!t){ t = document.createElement('div'); t.id='toast';
    t.style.cssText='position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#c9a227;color:#1a1a1a;padding:9px 16px;border-radius:20px;font-size:13px;z-index:99;transition:.2s';
    document.body.appendChild(t); }
  t.textContent = msg; t.style.opacity = 1;
  clearTimeout(window.__tt); window.__tt = setTimeout(()=>{ t.style.opacity = 0; }, 2200);
}

function updateBar(){
  const p = document.querySelector('#editbar .pend');
  if(p) p.textContent = pending ? ('待发布 ' + pending + ' 条') : '无改动';
}

fetch('/api/ping').then(r=>r.json()).then(()=>{
  EDIT = true; render();
  const b = document.createElement('div');
  b.id = 'editbar';
  b.innerHTML = '编辑模式 <span class="pend">无改动</span>' +
    '<button id="refBtn">重新拉取</button><button id="pubBtn">发布到网站</button>';
  document.body.appendChild(b);
  document.getElementById('refBtn').onclick = async function(){ await loadData(); toast('已重新拉取'); };
  document.getElementById('pubBtn').onclick = async function(){
    this.textContent='发布中…'; this.disabled = true;
    try{
      const r = await fetch('/api/publish'); const j = await r.json();
      if(j.ok){ pending = 0; updateBar(); await loadData(); toast('已发布，约 1 分钟公网生效'); }
      else { toast('发布失败：' + (j.step||'')); }
      console.log(j);
    }catch(e){ toast('发布失败'); }
    this.textContent='发布到网站'; this.disabled = false;
  };
  render();
}).catch(()=>{});

loadData();
</script>

<script>
(function(){
  var KEY='rr_theme';
  function apply(t){document.documentElement.setAttribute('data-theme',t);
    var b=document.getElementById('themeBtn'); if(b) b.textContent = t==='light'?'☀':'☾';}
  var t='dark';
  try{ t = localStorage.getItem(KEY) || 'dark'; }catch(e){}
  apply(t);
  document.addEventListener('click', function(e){
    if(e.target && e.target.id==='themeBtn'){
      var cur = document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';
      try{ localStorage.setItem(KEY, cur); }catch(e){}
      apply(cur);
    }
  });
})();
</script>


<div id="gate" style="position:fixed;inset:0;z-index:9999;background:#0d0e11;display:flex;align-items:center;justify-content:center;font-family:system-ui,'Microsoft YaHei',sans-serif">
  <div style="width:320px;text-align:center">
    <div style="color:#c9a227;font-size:20px;letter-spacing:.08em;margin-bottom:6px">角色造型参考库</div>
    <div style="color:#8b8f98;font-size:12px;margin-bottom:22px">内部资料 · 请输入访问密码</div>
    <input id="gateInput" type="password" placeholder="访问密码" style="width:100%;padding:11px 12px;border-radius:8px;border:1px solid #2a2c31;background:#15171b;color:#e6e6e6;outline:none" />
    <div id="gateMsg" style="color:#e06c5a;font-size:12px;height:18px;margin-top:8px"></div>
    <button id="gateBtn" style="width:100%;margin-top:6px;padding:11px;border-radius:8px;border:0;background:#c9a227;color:#1a1a1a;font-weight:600;cursor:pointer">进入</button>
  </div>
</div>
<script>
(function(){
  var PASS = "hanfu2026";
  if (location.hostname === "127.0.0.1" || location.hostname === "localhost") {
    var g0 = document.getElementById("gate"); if (g0) g0.remove(); return;
  }
  try { if (localStorage.getItem("rr_ok") === PASS) { document.getElementById("gate").remove(); return; } } catch(e) {}
  var inp = document.getElementById("gateInput"), msg = document.getElementById("gateMsg");
  function go(){
    if (inp.value === PASS) {
      try { localStorage.setItem("rr_ok", PASS); } catch(e) {}
      document.getElementById("gate").remove();
    } else { msg.textContent = "密码不对"; }
  }
  document.getElementById("gateBtn").addEventListener("click", go);
  inp.addEventListener("keydown", function(e){ if (e.key === "Enter") go(); });
  inp.focus();
})();
</script>

</body>
</html>
